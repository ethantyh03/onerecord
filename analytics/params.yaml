# ---------------------------------------------------------------- duplicates (customer records)
duplicates:
  # ~6% of customer records are duplicates [A13] [DS6]. Hero, misattribution, false-cross-sell and
  # romanisation plants count towards this. Generic duplicates fill the rest, per country.
  target_rate: 0.06
  generic_per_country: {SG: 2, MY: 3, TH: 4, VN: 3, MM: 2}
  generic_no_transactions_share: 0.25   # dup created but never used for orders [T]
  blank_tax_id_p: {SG: 0.35, MY: 0.40, TH: 0.55, VN: 0.55, MM: 0.60}
  address_format_p: 0.5
  # perturbation menu per country (one name perturbation drawn per duplicate, sometimes two) [DS5]
  name_perturbations:
    SG: [abbreviation, typo, word_reorder]
    MY: [abbreviation, word_reorder, typo]
    TH: [romanisation, typo, abbreviation, word_reorder]
    VN: [romanisation, abbreviation, typo]
    MM: [romanisation, typo, word_reorder]
  second_perturbation_p: 0.3
  # near-miss NON-duplicates (chains/sister sites with similar names) so precision is honest [DS5]
  near_miss_pairs: {SG: 1, MY: 1, TH: 1, VN: 1, MM: 1}
  matcher_split: {tune: [SG, MY], holdout: [TH, VN, MM]}   # [DS5]

# ---------------------------------------------------------------- streams (A6)
streams:
  pr_share_of_po_lines: {A: 0.035, B: 0.03, C: 0.85}   # PO lines that came through a formal quote/PR [T]
  pr_lead_days: [5, 35]                                 # PR created this many days before the PO [T]
  pr_lost_ratio: {SG: 0.40, MY: 0.45, TH: 0.50, VN: 0.45, MM: 1.10}   # lost PRs per converted PR; MM conversion low [FM §5.5 MM]
  mm_lost_ratio_growth: 0.35    # MM lost ratio rises 35%/yr -> conversion falling [T]
  open_pr_months: 1.2           # open (unconverted, not lost) pipeline ~1.2 months of PR flow [T]
  enquiries_per_month: {SG: 80, MY: 70, TH: 55, VN: 50, MM: 30}   # [T]
  enquiry_product_split: {A: 0.55, B: 0.30, C: 0.15}
  enquiry_trend_extra: {SG: 0.0, MY: 0.0, TH: 0.0, VN: 0.05, MM: 0.25}   # MM enquiries rising despite falling POs [FM §5.5 MM]
  enquiry_to_pr_p: 0.5          # share of PRs preceded by a logged enquiry [T]
  enquiry_channels: {email: 0.45, phone: 0.25, web: 0.15, rep: 0.15}
  prospect_share: 0.2           # enquiries from non-customers [T]
  followup_share_of_pos: 0.10   # [T]
  followup_topics: {delivery: 0.55, invoice: 0.25, return: 0.07, credit_note: 0.05, other: 0.08}
  # Stuck demand: PRs blocked by a pending MDM request. Seed total S$150-450k; pinned PR-5521/5527 [FM §5.6 #6] [plan pinned facts].
  max_prs_before_pinned: 5400  # PR ids are 4 digits and PR-5521/5527 are pinned: thin uniformly above this [plan pinned facts]
  blocked_extra_count: 10
  blocked_extra_sgd: [8000, 45000]

