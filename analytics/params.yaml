# ---------------------------------------------------------------- historic MDM requests (as-is process)
mdm_history:
  # Last 12 months only (Oct 2025 - Sep 2026) so ids REQ-0001..REQ-09xx never collide with the app's REQ-1001+.
  months: ["2025-10", "2026-09"]
  per_month: {customer: 30, extend: 5, item: 30, vendor: 10, costcentre: 5}   # ~80/month [A12]
  bounce_p: 0.40              # >=1 bounce for missing info [A13]
  second_bounce_p: 0.25       # of bounced requests [T]
  reject_p: 0.04              # [T]
  cancel_p: 0.03              # [T]
  duplicate_p: 0.06           # new customer record duplicated an existing one [A13]
  # Calendar-day components (lognormal median, sigma). Sequential hand-offs, as-is [A11] [FM §6.7]:
  # targets median ~14 calendar days overall [A26], items ~16-18 (App C: Amy 18 days).
  notice_days: [1.6, 0.5]     # waiting for MDM to notice the email
  bounce_days: [3.5, 0.5]     # per bounce (requestor travel / missing QA-RA field)
  step_days: [2.4, 0.55]      # per sequential approval step
  mdm_days: [1.5, 0.5]        # MDM queue + manual keying
  steps: {customer: 3, extend: 1, item: 3, vendor: 3, costcentre: 2}
  extra_step_p: {customer: 0.2, item: 0.85, vendor: 0.3, extend: 0.3, costcentre: 0.0}   # FD (credit > S$50k), QA/RA (IVD), QA/RA (regulated vendor), finance (credit terms)
  blocked_pr_p: 0.12          # created requests that had a PR waiting on them [T]
  requestor_roles: {customer: [requestor, sales_manager], extend: [requestor, sales_manager, business_support], item: [requestor, bu_head], vendor: [requestor, procurement], costcentre: [financial_controller, bu_head]}

